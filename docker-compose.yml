services:
  postgres:
    image: postgres:16-alpine
    container_name: payshield-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payshield}
      POSTGRES_USER: ${POSTGRES_USER:-payshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payshield_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - payshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payshield} -d ${POSTGRES_DB:-payshield}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payshield_pgdata:
