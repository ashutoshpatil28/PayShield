spring:
  datasource:
    url: jdbc:h2:mem:payshield_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

payshield:
  security:
    jwt-secret: test-only-jwt-secret-key-with-sufficient-length-32bytes
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    cors-allowed-origins: http://localhost:5173
    seed-demo-data: true
